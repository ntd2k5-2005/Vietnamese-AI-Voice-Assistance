[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnamese-voice-ai-tts"
version = "0.10.0"
description = "Vietnamese Voice AI speech synthesis service using VieNeu"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
